    - cogs
    - cost of sales
    - cost of revenue
    - cost of products sold
    - cost of services
    - material cost
    - raw material consumed
    - purchases of stock-in-trade
    - cost of materials consumed
    - changes in inventories
  gross_profit:
    - gross profit
  employee_expense:
