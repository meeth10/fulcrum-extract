formulas:
  gross_profit:
    expression: "revenue - cost_of_revenue"
    inputs: [revenue, cost_of_revenue]
  ebitda:
    expression: "ebit + depreciation + amortisation"
    inputs: [ebit, depreciation, amortisation]
  net_debt:
    expression: "total_debt - cash_and_equivalents"
    inputs: [total_debt, cash_and_equivalents]
  free_cash_flow:
    expression: "operating_cash_flow - capital_expenditure"
    inputs: [operating_cash_flow, capital_expenditure]
  ebitda_margin:
    expression: "ebitda / revenue * 100"
    inputs: [ebitda, revenue]
    unit: percent
  ebit_margin:
    expression: "ebit / revenue * 100"
    inputs: [ebit, revenue]
    unit: percent
  gross_margin:
    expression: "gross_profit / revenue * 100"
    inputs: [gross_profit, revenue]
    unit: percent
  net_margin:
    expression: "net_income / revenue * 100"
    inputs: [net_income, revenue]
    unit: percent
  current_ratio:
    expression: "current_assets / current_liabilities"
    inputs: [current_assets, current_liabilities]
    unit: x
  quick_ratio:
    expression: "(cash_and_equivalents + short_term_investments + accounts_receivable) / current_liabilities"
    inputs: [cash_and_equivalents, short_term_investments, accounts_receivable, current_liabilities]
    unit: x
  debt_to_equity:
    expression: "total_debt / shareholders_equity"
    inputs: [total_debt, shareholders_equity]
    unit: x
  debt_to_ebitda:
    expression: "total_debt / ebitda"
    inputs: [total_debt, ebitda]
    unit: x
  net_debt_to_ebitda:
    expression: "net_debt / ebitda"
    inputs: [net_debt, ebitda]
    unit: x
  interest_coverage:
    expression: "ebit / finance_cost"
    inputs: [ebit, finance_cost]
    unit: x
  fcf_margin:
    expression: "free_cash_flow / revenue * 100"
    inputs: [free_cash_flow, revenue]
    unit: percent
  cfo_to_ebitda:
    expression: "operating_cash_flow / ebitda * 100"
    inputs: [operating_cash_flow, ebitda]
    unit: percent
  cfo_to_pat:
    expression: "operating_cash_flow / net_income * 100"
    inputs: [operating_cash_flow, net_income]
    unit: percent
  revenue_growth:
    expression: "(revenue_current / revenue_prior - 1) * 100"
    inputs: [revenue_current, revenue_prior]
    unit: percent
  ebitda_growth:
    expression: "(ebitda_current / ebitda_prior - 1) * 100"
    inputs: [ebitda_current, ebitda_prior]
    unit: percent
  ebit_growth:
    expression: "(ebit_current / ebit_prior - 1) * 100"
    inputs: [ebit_current, ebit_prior]
    unit: percent
  pat_growth:
    expression: "(net_income_current / net_income_prior - 1) * 100"
    inputs: [net_income_current, net_income_prior]
    unit: percent
  net_cash:
    expression: "cash_and_equivalents - total_debt"
    inputs: [cash_and_equivalents, total_debt]
  working_capital:
    expression: "current_assets - current_liabilities"
    inputs: [current_assets, current_liabilities]
  asset_turnover:
    expression: "revenue / total_assets"
    inputs: [revenue, total_assets]
    unit: x
    note: "Closing total assets — see Rule 41's average-base preference for ROA/ROE; asset turnover uses the same closing-balance convention as current_ratio/quick_ratio elsewhere in this file."
  receivable_days:
    expression: "accounts_receivable / revenue * 365"
    inputs: [accounts_receivable, revenue]
    unit: days
  inventory_days:
    expression: "inventory / cost_of_revenue * 365"
    inputs: [inventory, cost_of_revenue]
    unit: days
  payable_days:
    expression: "accounts_payable / cost_of_revenue * 365"
    inputs: [accounts_payable, cost_of_revenue]
    unit: days
  cash_conversion_cycle:
    expression: "receivable_days + inventory_days - payable_days"
    inputs: [receivable_days, inventory_days, payable_days]
    unit: days

policies:
  direct_over_derived: true
  never_infer_zero: true
  never_mix_periods: true
  never_mix_entity_scope: true
  preferred_source_order:
    - audited_financial_statements
    - consolidated_financial_statements
    - notes_to_financial_statements
    - management_discussion
    - investor_presentation
  ev_ebitda: unavailable_without_equity_value
  negative_ebitda_multiple: not_meaningful
  negative_start_cagr: unavailable
  missing_required_input: unavailable
  derived_confidence_cap: weakest_input

validation:
  # See src/agent/validation.py for the executable form of every check
  # below (Rule Book §52). This block documents expression + tolerance;
  # validation.py is the source of truth for what actually runs.
  balance_sheet:
    expression: "total_assets - total_liabilities - shareholders_equity"
    tolerance_ratio: 0.005
  cash_flow_composition:
    expression: "operating_cash_flow + investing_cash_flow + financing_cash_flow - net_change_in_cash"
    tolerance_ratio: 0.01
  opening_closing_cash:
    expression: "opening_cash + net_change_in_cash - closing_cash"
    tolerance_ratio: 0.01
  ebitda:
    expression: "ebitda - ebit - depreciation - amortisation"
    tolerance_ratio: 0.01
  gross_profit:
    expression: "gross_profit - revenue + cost_of_revenue"
    tolerance_ratio: 0.01
  net_income_bridge:
    expression: "net_income - pbt + tax_expense"
    tolerance_ratio: 0.01
    note: "Before exceptional items — a real mismatch here may legitimately be exceptional_items, not an extraction error; validation.py reports it as a FAIL to surface, not to auto-explain."
  debt_composition:
    expression: "total_debt - short_term_debt - long_term_debt"
    tolerance_ratio: 0.01
